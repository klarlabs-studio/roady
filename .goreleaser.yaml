# .goreleaser.yaml
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: roady
    main: ./cmd/roady/main.go
    binary: roady
    ldflags:
      - -s -w
      - -X github.com/felixgeelhaar/roady/internal/infrastructure/cli.Version={{.Version}}
      - -X github.com/felixgeelhaar/roady/internal/infrastructure/cli.Commit={{.Commit}}
      - -X github.com/felixgeelhaar/roady/internal/infrastructure/cli.Date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # One archive per platform containing the roady binary.
  - id: bundle
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md*
      - ROADMAP.md*
      - docs/positioning.md*
      - docs/vs.md*
      - docs/advanced.md*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore\(\.roady\):'

# The tap is the one owned by the org that owns this repo, which is also the
# scope HOMEBREW_TAP_TOKEN — a klarlabs-studio org secret — can write to. An
# org secret does not reach a personal repo, which answers 403: briefkasten's
# v0.31.0 published every artifact and then failed exactly there.
# homebrew_casks replaces brews (deprecated in GoReleaser v2.16). Homebrew's
# own guidance is that a cask, not a formula, is the right vehicle for a
# pre-compiled binary -- the formula path generated something that only
# pretended to build from source.
homebrew_casks:
  - name: roady
    repository:
      owner: klarlabs-studio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://felixgeelhaar.github.io/roady/"
    description: "A planning-first system of record for software work."
    license: "MIT"
    # Only binaries a build above produces. v0.25.0 removed the plugin builds
    # and left them here, and brew then failed every install and upgrade on the
    # first missing symlink source. release_config_test.go holds this list to
    # the builds.
    binaries:
      - roady
    hooks:
      post:
        # The release archives are not notarized, so Gatekeeper quarantines
        # every binary on first run. A formula was never subject to this; a cask
        # is, so without this the CLI refuses to start. Stripped across
        # staged_path so a binary added later is covered too.
        install: |
          if OS.mac?
            system_command "xattr", args: ["-dr", "com.apple.quarantine", staged_path]
          end

release:
  # A re-drive (release.yml's workflow_dispatch) must be able to reach the step
  # it is being re-driven for. By default goreleaser re-uploads every asset and
  # dies on `422 already_exists` long before the brew push, so the recovery path
  # would exist but never recover.
  #
  # These are two separate settings and only the second governs assets: `mode`
  # is an enum over the release NOTES, `replace_existing_artifacts` over the
  # uploaded ARTIFACTS. warden set only `mode` and its re-drive failed exactly
  # this way, twice, before anyone noticed the key did something else.
  mode: replace
  replace_existing_artifacts: true
